<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vani Raj &amp; Uma Singh | Blog &amp; Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root{
  --bg: #FAFAF9;
  --surface: #FFFFFF;
  --soft: #F1F3F5;
  --ink: #0E1218;
  --mute: #596172;
  --line: #E2E5EA;
  --acc: #1E3AEC;
  --hi: #E2F542;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #090B0E;
    --surface: #12151B;
    --soft: #171B23;
    --ink: #EDEFF4;
    --mute: #8E97A8;
    --line: #222733;
    --acc: #687DFF;
  }
}
:root[data-theme="dark"]{
  --bg: #090B0E;
  --surface: #12151B;
  --soft: #171B23;
  --ink: #EDEFF4;
  --mute: #8E97A8;
  --line: #222733;
  --acc: #687DFF;
}

*{box-sizing:border-box}
body{
  margin:0;
  padding-top:76px;
  padding-bottom:64px;
  background:var(--bg);
  color:var(--ink);
  font:400 16.5px/1.65 'Instrument Sans', system-ui, sans-serif;
  letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,.nav-logo,.btn-cta{
  font-family:'Bricolage Grotesque', 'Arial Narrow', sans-serif;
  letter-spacing:-0.03em;
}

.w{max-width:820px;margin:0 auto;padding:0 24px}

/* Top Bar */
.top-bar{
  position:fixed;
  top:0;left:0;right:0;
  height:64px;
  background:rgba(250, 250, 249, 0.88);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  z-index:90;
  display:flex;
  align-items:center;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .top-bar{background:rgba(9, 11, 14, 0.88)}
}
:root[data-theme="dark"] .top-bar{background:rgba(9, 11, 14, 0.88)}

.top-bar .w{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1160px}
.nav-logo{font-size:18px;font-weight:800;color:var(--ink);text-decoration:none}
.nav-links{display:flex;align-items:center;gap:18px}
.nav-links a{color:var(--mute);text-decoration:none;font-size:14px;font-weight:600;transition:color .2s}
.nav-links a:hover{color:var(--ink)}
.btn-cta{
  background:var(--ink);
  color:var(--bg);
  padding:7px 18px;
  border-radius:99px;
  font-size:13.5px;
  font-weight:700;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:6px;
}

/* Blog Content */
.blog-header{padding:32px 0 24px;border-bottom:1px solid var(--line)}
.blog-header h1{font-size:clamp(40px, 6vw, 64px);line-height:0.95;margin:0 0 12px;font-weight:800}
.blog-header p{color:var(--mute);margin:0;font-size:18px}

.post-list{margin-top:40px;display:flex;flex-direction:column;gap:40px}
.post-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:32px;
  box-shadow:0 4px 20px rgba(0,0,0,0.02);
}
.post-tag{
  display:inline-block;
  background:var(--hi);
  color:#111418;
  padding:3px 10px;
  border-radius:99px;
  font-size:12px;
  font-weight:700;
  margin-bottom:12px;
}
.post-date{font-size:13px;color:var(--mute);margin-bottom:8px}
.post-title{font-size:clamp(24px, 3.2vw, 32px);margin:0 0 16px;line-height:1.2;color:var(--ink)}
.post-body{color:var(--ink);line-height:1.7}
.post-body p{margin:0 0 16px}
.post-body p:last-child{margin-bottom:0}

/* Bottom Bar */
.bottom-bar{
  position:fixed;
  bottom:0;left:0;right:0;
  height:56px;
  background:rgba(250, 250, 249, 0.92);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  z-index:90;
  display:flex;
  align-items:center;
  font-size:13.5px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .bottom-bar{background:rgba(9, 11, 14, 0.92)}
}
:root[data-theme="dark"] .bottom-bar{background:rgba(9, 11, 14, 0.92)}

.bottom-bar .w{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  max-width:1160px;
}
.bot-team .team-names{color:var(--ink);font-weight:700}
.bot-actions{display:flex;align-items:center;gap:12px}
.bot-btn{
  color:var(--ink);
  text-decoration:none;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--soft);
  border:1px solid var(--line);
  padding:5px 12px;
  border-radius:99px;
  font-size:12.5px;
}
.bot-btn.wa{background:var(--acc);color:#fff;border-color:transparent}
</style>
</head>
<body>

<header class="top-bar">
  <div class="w">
    <a href="./index.html" class="nav-logo">Vani &amp; Uma</a>
    <nav class="nav-links">
      <a href="./index.html">← Back to Portfolio</a>
      <a href="https://wa.me/918586010263?text=Hi%20Vani%20%26%20Uma%2C%20let%27s%20discuss%20a%20project%21" target="_blank" rel="noopener" class="btn-cta">
        Chat on WhatsApp
      </a>
    </nav>
  </div>
</header>

<main class="w">
  <header class="blog-header">
    <h1>Notes &amp; Insights</h1>
    <p>Articles on creative scripting, SEO strategies, and performance marketing.</p>
  </header>

  <div id="posts-container" class="post-list">
    <p style="color:var(--mute)">Loading blog posts from /blogs/...</p>
  </div>
</main>

<footer class="bottom-bar">
  <div class="w">
    <div class="bot-team">
      <span class="team-names">Vani Raj &amp; Uma Singh</span>
    </div>
    <div class="bot-actions">
      <a href="tel:+918586010263" class="bot-btn">📞 +91 85860 10263</a>
      <a href="https://wa.me/918586010263" target="_blank" rel="noopener" class="bot-btn wa">💬 WhatsApp</a>
    </div>
  </div>
</footer>

<script>
const REPO_OWNER = 'vaniraj17-dme';
const REPO_NAME = 'potfolio';
const FOLDER_PATH = 'blogs';

async function loadBlogs() {
  const container = document.getElementById('posts-container');
  try {
    const apiRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FOLDER_PATH}`);
    if (!apiRes.ok) {
      container.innerHTML = '<p style="color:var(--mute)">No articles found in /blogs/ folder.</p>';
      return;
    }
    const files = await apiRes.json();
    const mdFiles = files.filter(f => f.name.endsWith('.md')).reverse();

    if (mdFiles.length === 0) {
      container.innerHTML = '<p style="color:var(--mute)">No markdown posts found in /blogs/ yet.</p>';
      return;
    }

    container.innerHTML = '';

    for (const file of mdFiles) {
      const postRes = await fetch(file.download_url);
      const rawText = await postRes.text();

      let title = file.name.replace('.md', '').replace(/-/g, ' ');
      let date = '';
      let tag = 'Article';
      let bodyText = rawText;

      if (rawText.startsWith('---')) {
        const parts = rawText.split('---');
        if (parts.length >= 3) {
          const metaLines = parts[1].split('\n');
          metaLines.forEach(line => {
            const [k, ...v] = line.split(':');
            if (k && v) {
              const key = k.trim().toLowerCase();
              const val = v.join(':').trim();
              if (key === 'title') title = val;
              if (key === 'date') date = val;
              if (key === 'tag') tag = val;
            }
          });
          bodyText = parts.slice(2).join('---').trim();
        }
      }

      const htmlContent = marked.parse(bodyText);

      const article = document.createElement('article');
      article.className = 'post-card';
      article.innerHTML = `
        ${tag ? `<span class="post-tag">\${tag}</span>` : ''}
        ${date ? `<div class="post-date">\${date}</div>` : ''}
        <h2 class="post-title">${title}</h2>
        <div class="post-body">${htmlContent}</div>
      `;
      container.appendChild(article);
    }
  } catch (err) {
    container.innerHTML = '<p style="color:var(--mute)">Failed to fetch blogs. Please check your GitHub repository.</p>';
  }
}

loadBlogs();
</script>
</body>
</html>
