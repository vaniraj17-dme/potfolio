<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blog &amp; Insights | Vani Raj &amp; Uma Singh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg: #FAFAF9;
  --surface: #FFFFFF;
  --soft: #F1F3F5;
  --ink: #0E1218;
  --mute: #596172;
  --line: #E2E5EA;
  --acc: #1E3AEC;
  --hi: #E2F542;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #090B0E;
    --surface: #12151B;
    --soft: #171B23;
    --ink: #EDEFF4;
    --mute: #8E97A8;
    --line: #222733;
    --acc: #687DFF;
  }
}
:root[data-theme="dark"]{
  --bg: #090B0E;
  --surface: #12151B;
  --soft: #171B23;
  --ink: #EDEFF4;
  --mute: #8E97A8;
  --line: #222733;
  --acc: #687DFF;
}

*{box-sizing:border-box}
body{
  margin:0;
  padding-top:72px;
  padding-bottom:64px;
  background:var(--bg);
  color:var(--ink);
  font:400 16.5px/1.65 'Instrument Sans', system-ui, sans-serif;
  letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,.nav-logo,.btn-cta{
  font-family:'Bricolage Grotesque', 'Arial Narrow', sans-serif;
  letter-spacing:-0.03em;
}

.w{max-width:820px;margin:0 auto;padding:0 24px}

/* Top Navigation Bar */
.top-bar{
  position:fixed;
  top:0;left:0;right:0;
  height:64px;
  background:rgba(250, 250, 249, 0.88);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  z-index:90;
  display:flex;
  align-items:center;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .top-bar{background:rgba(9, 11, 14, 0.88)}
}
:root[data-theme="dark"] .top-bar{background:rgba(9, 11, 14, 0.88)}

.top-bar .w{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1160px}
.nav-logo{font-size:18px;font-weight:800;color:var(--ink);text-decoration:none}
.nav-links{display:flex;align-items:center;gap:18px}
.nav-links a{color:var(--mute);text-decoration:none;font-size:14px;font-weight:600;transition:color .2s}
.nav-links a:hover{color:var(--ink)}
.btn-cta{
  background:var(--ink);
  color:var(--bg);
  padding:7px 18px;
  border-radius:99px;
  font-size:13.5px;
  font-weight:700;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:6px;
}

/* Header */
.blog-header{padding:32px 0 20px;border-bottom:1px solid var(--line)}
.blog-header h1{font-size:clamp(38px, 5.5vw, 56px);line-height:0.96;margin:0 0 10px;font-weight:800}
.blog-header p{color:var(--mute);margin:0;font-size:17px}

/* View 1: Articles List */
.post-list{margin-top:36px;display:flex;flex-direction:column;gap:20px}
.post-item{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:26px 28px;
  cursor:pointer;
  transition:all .2s ease;
  text-decoration:none;
  color:inherit;
  display:block;
}
.post-item:hover{
  border-color:var(--acc);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(0,0,0,0.04);
}
.post-meta{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute);margin-bottom:10px}
.post-tag{
  background:var(--hi);
  color:#111418;
  padding:2px 9px;
  border-radius:99px;
  font-weight:700;
  font-size:11.5px;
}
.post-title{font-size:clamp(22px, 2.8vw, 26px);margin:0 0 8px;line-height:1.2;color:var(--ink);font-weight:700}
.post-excerpt{color:var(--mute);margin:0 0 14px;font-size:15px;line-height:1.55}
.post-cta{color:var(--acc);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px}

/* View 2: Full Article Reader */
.article-view{display:none;margin-top:32px}
.back-btn{
  background:none;
  border:none;
  color:var(--mute);
  font:600 14.5px 'Instrument Sans', sans-serif;
  cursor:pointer;
  padding:0;
  margin-bottom:24px;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.back-btn:hover{color:var(--ink)}
.full-article{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:36px;
  box-shadow:0 4px 20px rgba(0,0,0,0.02);
}
.article-title{font-size:clamp(28px, 4vw, 42px);margin:12px 0 20px;line-height:1.15;color:var(--ink);font-weight:800}
.article-body{font-size:16.5px;line-height:1.75;color:var(--ink);white-space:pre-line}
.article-body p{margin:0 0 18px}

/* Bottom Bar */
.bottom-bar{
  position:fixed;
  bottom:0;left:0;right:0;
  height:56px;
  background:rgba(250, 250, 249, 0.92);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  z-index:90;
  display:flex;
  align-items:center;
  font-size:13.5px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .bottom-bar{background:rgba(9, 11, 14, 0.92)}
}
:root[data-theme="dark"] .bottom-bar{background:rgba(9, 11, 14, 0.92)}

.bottom-bar .w{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  max-width:1160px;
}
.bot-team .team-names{color:var(--ink);font-weight:700}
.bot-actions{display:flex;align-items:center;gap:12px}
.bot-btn{
  color:var(--ink);
  text-decoration:none;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--soft);
  border:1px solid var(--line);
  padding:5px 12px;
  border-radius:99px;
  font-size:12.5px;
}
.bot-btn.wa{background:var(--acc);color:#fff;border-color:transparent}
</style>
</head>
<body>

<header class="top-bar">
  <div class="w">
    <a href="./index.html" class="nav-logo">Vani &amp; Uma</a>
    <nav class="nav-links">
      <a href="./index.html">← Back to Portfolio</a>
      <a href="https://wa.me/918586010263?text=Hi%20Vani%20%26%20Uma%2C%20let%27s%20discuss%20a%20project%21" target="_blank" rel="noopener" class="btn-cta">
        Chat on WhatsApp
      </a>
    </nav>
  </div>
</header>

<main class="w">
  <!-- View 1: List Container -->
  <section id="list-view">
    <header class="blog-header">
      <h1>Articles &amp; Case Studies</h1>
      <p>Short breakdowns on creative scripting, SEO, and paid performance campaigns.</p>
    </header>
    <div id="posts-list" class="post-list">
      <p style="color:var(--mute)">Loading articles...</p>
    </div>
  </section>

  <!-- View 2: Single Post Reader -->
  <section id="article-view" class="article-view">
    <button class="back-btn" onclick="showListView()">← Back to all articles</button>
    <article class="full-article">
      <div id="article-meta" class="post-meta"></div>
      <h1 id="article-title" class="article-title"></h1>
      <div id="article-body" class="article-body"></div>
    </article>
  </section>
</main>

<footer class="bottom-bar">
  <div class="w">
    <div class="bot-team">
      <span class="team-names">Vani Raj &amp; Uma Singh</span>
    </div>
    <div class="bot-actions">
      <a href="tel:+918586010263" class="bot-btn">📞 +91 85860 10263</a>
      <a href="https://wa.me/918586010263" target="_blank" rel="noopener" class="bot-btn wa">💬 WhatsApp</a>
    </div>
  </div>
</footer>

<script>
let allPosts = [];

// Load posts list from local JSON file
async function initBlog() {
  const listContainer = document.getElementById('posts-list');
  try {
    const res = await fetch('blogs/index.json');
    if (!res.ok) throw new Error();
    allPosts = await res.json();

    if (!allPosts.length) {
      listContainer.innerHTML = '<p style="color:var(--mute)">No articles published yet.</p>';
      return;
    }

    listContainer.innerHTML = allPosts.map(post => `
      <div class="post-item" onclick="openPost('${post.slug}')">
        <div class="post-meta">
          <span class="post-tag">${post.tag || 'Case Study'}</span>
          <span>${post.date}</span>
          <span>•</span>
          <span>${post.readTime || '3 min read'}</span>
        </div>
        <h2 class="post-title">${post.title}</h2>
        <p class="post-excerpt">${post.excerpt}</p>
        <div class="post-cta">Read Article →</div>
      </div>
    `).join('');

    // Check if URL has a direct link (e.g. blog.html?post=slug)
    const urlParams = new URLSearchParams(window.location.search);
    const postSlug = urlParams.get('post');
    if (postSlug) {
      openPost(postSlug, false);
    }
  } catch (e) {
    listContainer.innerHTML = '<p style="color:var(--mute)">Failed to load articles. Ensure blogs/index.json exists.</p>';
  }
}

// Open full article reader
async function openPost(slug, updateHistory = true) {
  const post = allPosts.find(p => p.slug === slug);
  if (!post) return;

  const listView = document.getElementById('list-view');
  const articleView = document.getElementById('article-view');
  const bodyContainer = document.getElementById('article-body');

  listView.style.display = 'none';
  articleView.style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });

  document.getElementById('article-meta').innerHTML = `
    <span class="post-tag">${post.tag || 'Article'}</span>
    <span>${post.date}</span>
    <span>•</span>
    <span>${post.readTime || '3 min read'}</span>
  `;
  document.getElementById('article-title').innerText = post.title;
  bodyContainer.innerHTML = '<p style="color:var(--mute)">Loading content...</p>';

  if (updateHistory) {
    history.pushState({ slug }, '', `?post=${slug}`);
  }

  try {
    const fileRes = await fetch(`blogs/${post.file}`);
    if (!fileRes.ok) throw new Error();
    const rawContent = await fileRes.text();
    bodyContainer.innerText = rawContent;
  } catch (e) {
    bodyContainer.innerHTML = '<p style="color:var(--mute)">Could not load the article file.</p>';
  }
}

// Switch back to list view
function showListView() {
  document.getElementById('article-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';
  history.pushState({}, '', window.location.pathname);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('popstate', (e) => {
  if (e.state && e.state.slug) {
    openPost(e.state.slug, false);
  } else {
    showListView();
  }
});

initBlog();
</script>
</body>
</html>
